<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mendify – Login / Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Login page — Modern UI ── */
    :root {
      --auth-glow-1: rgba(124,111,255,.15);
      --auth-glow-2: rgba(196,116,255,.10);
      --auth-border: rgba(255,255,255,.06);
      --auth-text: #e2e2f0;
      --auth-muted: #7e7e9a;
      --auth-faint: #505076;
      --auth-primary: #7c6fff;
      --auth-primary-strong: #a699ff;
      --auth-surface: rgba(15,16,25,.85);
      --auth-surface-2: rgba(20,21,34,.6);
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #06060e;
      position: relative;
      overflow: hidden;
    }

    /* Ambient gradient mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 0% 20%, rgba(124,111,255,.10), transparent 60%),
        radial-gradient(ellipse 60% 50% at 100% 80%, rgba(196,116,255,.08), transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(124,111,255,.04), transparent 50%);
      pointer-events: none;
      z-index: 0;
      animation: authMesh 18s ease-in-out infinite alternate;
    }

    @keyframes authMesh {
      0%   { transform: scale(1) rotate(0deg); }
      100% { transform: scale(1.1) rotate(3deg); }
    }

    body::after {
      content: '';
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,111,255,.08), transparent 60%);
      top: -10%; left: -8%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: authFloat 14s ease-in-out infinite alternate;
    }

    @keyframes authFloat {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 30px) scale(1.15); }
    }

    /* Floating particles */
    .auth-particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .auth-particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(124,111,255,.25);
      border-radius: 50%;
      animation: particleFloat var(--dur, 8s) ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
    }

    @keyframes particleFloat {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: .3; }
      100% { transform: translateY(-120px) translateX(40px) scale(1.5); opacity: .8; }
    }

    /* Grid pattern overlay */
    .auth-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at center, black 30%, transparent 70%);
      mask-image: radial-gradient(ellipse 60% 50% at center, black 30%, transparent 70%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      position: relative;
      z-index: 1;
      animation: authFadeUp .5s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes authFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-box {
      background: linear-gradient(
        160deg,
        rgba(18,19,30,.92),
        rgba(10,10,18,.95)
      );
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 24px;
      padding: 36px 32px 32px;
      box-shadow:
        0 24px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(124,111,255,.06) inset,
        0 1px 0 rgba(255,255,255,.05) inset;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      overflow: hidden;
      transition: box-shadow 300ms ease;
    }

    .auth-box:hover {
      box-shadow:
        0 24px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(124,111,255,.1) inset,
        0 1px 0 rgba(255,255,255,.05) inset,
        0 0 60px rgba(124,111,255,.06);
    }

    /* Animated border glow */
    .auth-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,111,255,.3), transparent);
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% { opacity: .6; }
      50%      { opacity: 1; }
    }

    /* Shimmer overlay */
    .auth-box::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(124,111,255,.03), transparent 40%);
      pointer-events: none;
      animation: shimmerDrift 10s ease-in-out infinite alternate;
    }

    @keyframes shimmerDrift {
      0%   { transform: translate(-5%, -5%); }
      100% { transform: translate(5%, 5%); }
    }

    .auth-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      position: relative;
      z-index: 1;
    }

    .auth-logo-icon {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(124,111,255,.2), rgba(124,111,255,.05));
      border: 1px solid rgba(124,111,255,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }

    .auth-logo-icon:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(124,111,255,.15);
    }

    .auth-logo-icon::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124,111,255,.3), transparent 60%);
      z-index: -1;
    }

    .auth-logo-icon svg {
      width: 24px;
      height: 24px;
      color: #a699ff;
    }

    .auth-logo-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      font-weight: 600;
      color: var(--auth-text);
      letter-spacing: -.3px;
      background: linear-gradient(135deg, #c4b4ff, #7c6fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-tagline {
      text-align: center;
      margin-bottom: 26px;
      position: relative;
      z-index: 1;
    }

    .auth-tagline p {
      margin: 0;
      font-size: 12.5px;
      color: var(--auth-muted);
      line-height: 1.6;
    }

    .auth-tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 22px;
      background: rgba(20,21,34,.5);
      border: 1px solid rgba(255,255,255,.04);
      border-radius: 12px;
      padding: 4px;
      position: relative;
      z-index: 1;
    }

    .auth-tab {
      flex: 1;
      padding: 9px;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--auth-muted);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      border-radius: 9px;
      cursor: pointer;
      transition: all 200ms cubic-bezier(.16,1,.3,1);
      position: relative;
    }

    .auth-tab.active {
      background: rgba(124,111,255,.12);
      color: var(--auth-primary-strong);
      box-shadow: 0 2px 8px rgba(124,111,255,.08);
    }

    .auth-tab:hover:not(.active) { color: var(--auth-text); }

    .auth-form { display: none; }
    .auth-form.active {
      display: block;
      animation: authSlideIn .25s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes authSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-form .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .auth-form label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--auth-muted);
      letter-spacing: .5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 13px;
      width: 15px;
      height: 15px;
      color: var(--auth-faint);
      pointer-events: none;
      flex: 0 0 auto;
      transition: color 180ms ease;
    }

    .input-wrap:focus-within .input-icon {
      color: var(--auth-primary);
    }

    .auth-form input {
      width: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13.5px;
      background: rgba(9,9,15,.6);
      color: var(--auth-text);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 11px;
      padding: 12px 14px 12px 38px;
      outline: none;
      transition: all 200ms ease;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
    }

    .password-toggle .auth-form input {
      padding-right: 42px;
    }

    .auth-form input:focus {
      border-color: rgba(124,111,255,.5);
      box-shadow:
        0 0 0 3px rgba(124,111,255,.1),
        0 0 20px rgba(124,111,255,.06);
    }

    .auth-form input::placeholder { color: #3a3a5a; }

    .password-toggle { position: relative; }

    .toggle-eye {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--auth-faint);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      line-height: 1;
      border-radius: 6px;
      transition: all 130ms ease;
    }

    .toggle-eye:hover {
      color: var(--auth-text);
      background: rgba(255,255,255,.04);
    }

    .auth-btn {
      width: 100%;
      padding: 13px;
      margin-top: 4px;
      font-size: 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      background: linear-gradient(135deg, #7c6fff, #5b4de0);
      border: none;
      border-radius: 12px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,111,255,.25);
      transition: all 200ms ease;
      position: relative;
      overflow: hidden;
      letter-spacing: .2px;
    }

    .auth-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.08), transparent 50%);
      pointer-events: none;
    }

    .auth-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,.08), transparent 50%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease;
    }

    .auth-btn:hover:not(:disabled)::after { opacity: 1; }

    .auth-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #9080ff, #7c6fff);
      box-shadow: 0 6px 28px rgba(124,111,255,.35);
      transform: translateY(-1px);
    }

    .auth-btn:active:not(:disabled) { transform: translateY(1px); }

    .auth-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .auth-error {
      background: rgba(255,77,109,.08);
      border: 1px solid rgba(255,77,109,.2);
      color: #ff6b81;
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
      line-height: 1.5;
      position: relative;
      z-index: 1;
      animation: authSlideIn .2s ease both;
    }

    .auth-success {
      background: rgba(61,218,132,.08);
      border: 1px solid rgba(61,218,132,.2);
      color: #5be89a;
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 12.5px;
      margin-bottom: 14px;
      display: none;
      line-height: 1.5;
      position: relative;
      z-index: 1;
      animation: authSlideIn .2s ease both;
    }

    .auth-redirect {
      text-align: center;
      margin-top: 16px;
      font-size: 12.5px;
      color: var(--auth-muted);
      position: relative;
      z-index: 1;
    }

    .auth-redirect a {
      color: var(--auth-primary-strong);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 130ms ease;
    }

    .auth-redirect a:hover {
      color: var(--auth-primary);
      text-decoration: underline;
    }

    .auth-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: authSpin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes authSpin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .auth-box { padding: 26px 18px 22px; border-radius: 18px; }
      .auth-logo-icon { width: 42px; height: 42px; }
      .auth-logo-icon svg { width: 20px; height: 20px; }
      .auth-form input { padding: 11px 12px 11px 34px; font-size: 14px; }
      .input-wrap .input-icon { left: 11px; width: 13px; height: 13px; }
      .auth-btn { padding: 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="auth-grid"></div>

  <div class="auth-particles" id="authParticles"></div>

  <div class="auth-container">
    <div class="auth-box">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <path d="M14 17h7"></path>
            <path d="M17 14v7"></path>
          </svg>
        </div>
        <span class="auth-logo-name">Mendify</span>
      </div>

      <!-- Tagline -->
      <div class="auth-tagline">
        <p>AI engineering workspace — generate, debug, secure, and ship.</p>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-form="login">Log In</button>
        <button class="auth-tab" data-form="register">Sign Up</button>
      </div>

      <!-- Messages -->
      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <!-- Login Form -->
      <form class="auth-form active" id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 4L12 13 2 4"></path>
            </svg>
            <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="password-toggle">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
              <input type="password" id="loginPassword" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required autocomplete="current-password" />
            </div>
            <button type="button" class="toggle-eye" onclick="togglePassword('loginPassword', this)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="loginBtn">Sign In</button>
        <div class="auth-redirect" style="display:flex;justify-content:space-between;">
          <a onclick="showForgotPassword()">Forgot password?</a>
          <a onclick="switchAuthTab('register')">Create account</a>
        </div>
      </form>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="forgotForm">
        <div class="form-group">
          <label for="forgotEmail">Email address</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 4L12 13 2 4"></path>
            </svg>
            <input type="email" id="forgotEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>
        <p style="margin:-10px 0 16px;font-size:12.5px;color:var(--auth-muted);line-height:1.5;">
          Enter your email and we'll send a reset token. In development mode the token appears in the API response.
        </p>
        <button type="submit" class="auth-btn" id="forgotBtn">Send Reset Link</button>
        <div class="auth-redirect">
          <a onclick="switchAuthTab('login')">Back to sign in</a>
        </div>
      </form>

      <!-- Reset Password Form -->
      <form class="auth-form" id="resetForm">
        <div class="form-group">
          <label for="resetToken">Reset token</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0110 0v4"></path>
            </svg>
            <input type="text" id="resetToken" placeholder="Paste the reset token from the API response" required />
          </div>
        </div>
        <div class="form-group">
          <label for="resetPassword">New password</label>
          <div class="password-toggle">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
              <input type="password" id="resetNewPassword" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
            </div>
            <button type="button" class="toggle-eye" onclick="togglePassword('resetNewPassword', this)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="resetBtn">Reset Password</button>
        <div class="auth-redirect">
          <a onclick="switchAuthTab('login')">Back to sign in</a>
        </div>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="registerForm" autocomplete="on">
        <div class="form-group">
          <label for="regUsername">Username</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" id="regUsername" placeholder="johndoe" required minlength="3" autocomplete="username" />
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="M22 4L12 13 2 4"></path>
            </svg>
            <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
          </div>
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <div class="password-toggle">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
              <input type="password" id="regPassword" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" />
            </div>
            <button type="button" class="toggle-eye" onclick="togglePassword('regPassword', this)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <div class="password-toggle">
            <div class="input-wrap">
              <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0110 0v4"></path>
              </svg>
              <input type="password" id="regConfirm" placeholder="Repeat password" required minlength="8" autocomplete="new-password" />
            </div>
            <button type="button" class="toggle-eye" onclick="togglePassword('regConfirm', this)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="auth-btn" id="registerBtn">Create Account</button>
        <div class="auth-redirect">
          Already a member? <a onclick="switchAuthTab('login')">Sign in</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    'use strict';

    // ── Floating particles ──
    (function createParticles() {
      const container = document.getElementById('authParticles');
      if (!container) return;
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'auth-particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        p.style.setProperty('--dur', (6 + Math.random() * 8) + 's');
        p.style.setProperty('--delay', (Math.random() * 4) + 's');
        container.appendChild(p);
      }
    })();

    const API_BASE = window.MENDIFY_API_URL || 'http://localhost:5000';

    // ── Tab switching ──
    function switchAuthTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.form === tab));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.toggle('active', f.id === tab + 'Form'));
      hideMessages();
    }

    document.querySelectorAll('.auth-tab').forEach(btn => {
      btn.addEventListener('click', () => switchAuthTab(btn.dataset.form));
    });

    // ── Password visibility toggle ──
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPassword = input.type === 'password';
      input.type = isPassword ? 'text' : 'password';
      btn.innerHTML = isPassword
        ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    }

    // ── BUG FIX: showError('') used to set display:block with empty text,
    //    making the red error container flash visibly before each API call.
    //    Now passing a falsy msg hides the element instead. ──
    function showError(msg) {
      const el = document.getElementById('authError');
      if (!msg) {
        el.style.display = 'none';
        return;
      }
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('authSuccess').style.display = 'none';
    }

    function showSuccess(msg) {
      const el = document.getElementById('authSuccess');
      if (!msg) {
        el.style.display = 'none';
        return;
      }
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('authError').style.display = 'none';
    }

    function hideMessages() {
      showError('');
      showSuccess('');
    }

    // ── Set loading state ──
    function setBtnLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      if (loading) {
        btn.dataset.label = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="auth-spinner"></span> Processing...';
      } else {
        btn.disabled = false;
        btn.innerHTML = btn.dataset.label || btn.innerHTML;
      }
    }

    // ── Login handler ──
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) { showError('Please fill in all fields.'); return; }

      setBtnLoading('loginBtn', true);
      showError('');

      try {
        const res  = await fetch(API_BASE + '/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || data.message || 'Login failed.');
          setBtnLoading('loginBtn', false);
          return;
        }

        localStorage.setItem('access_token',  data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('user',          JSON.stringify(data.user));

        window.location.assign('index.html');
      } catch {
        showError('Cannot connect to server. Make sure the backend is running.');
        setBtnLoading('loginBtn', false);
      }
    });

    // ── Register handler ──
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;

      if (!username || !email || !password || !confirm) {
        showError('Please fill in all fields.');
        return;
      }
      if (username.length < 3) {
        showError('Username must be at least 3 characters.');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }
      if (password !== confirm) {
        showError('Passwords do not match.');
        return;
      }

      setBtnLoading('registerBtn', true);
      showError('');

      try {
        const res  = await fetch(API_BASE + '/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          // BUG FIX: previous code had an operator-precedence bug:
          //   data.error || data.details ? X : 'Registration failed'
          // was evaluated as:
          //   (data.error || data.details) ? X : 'Registration failed'
          // so when only data.error was set, the ternary always ran X
          // (Object.values({}) = []) and the displayed message was ''.
          // Correct form: prefer data.error, then flatten details, then fallback.
          const msg = data.error
            || (data.details ? Object.values(data.details).flat().join('. ') : null)
            || 'Registration failed.';
          showError(msg);
          setBtnLoading('registerBtn', false);
          return;
        }

        localStorage.setItem('access_token',  data.access_token);
        localStorage.setItem('refresh_token', data.refresh_token);
        localStorage.setItem('user',          JSON.stringify(data.user));

        showSuccess('Account created! Redirecting...');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch {
        showError('Cannot connect to server. Make sure the backend is running.');
        setBtnLoading('registerBtn', false);
      }
    });

    // ── Show forgot password form ──
    function showForgotPassword() {
      hideMessages();
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById('forgotForm').classList.add('active');
    }

    // ── Forgot password handler ──
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value.trim();
      if (!email) { showError('Please enter your email address.'); return; }

      setBtnLoading('forgotBtn', true);
      showError('');

      try {
        const res  = await fetch(API_BASE + '/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Request failed.');
          setBtnLoading('forgotBtn', false);
          return;
        }

        // Pre-fill the reset form with the returned token (dev mode)
        document.getElementById('resetToken').value = data.reset_token || '';
        document.getElementById('resetNewPassword').value = '';
        document.getElementById('resetNewPassword').focus();

        // Switch to reset form
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        document.getElementById('resetForm').classList.add('active');

        showSuccess('Reset token generated! ' + (data.note || ''));
      } catch {
        showError('Cannot connect to server. Make sure the backend is running.');
      } finally {
        setBtnLoading('forgotBtn', false);
      }
    });

    // ── Reset password handler ──
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('resetToken').value.trim();
      const password = document.getElementById('resetNewPassword').value;

      if (!token) { showError('Please paste your reset token.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }

      setBtnLoading('resetBtn', true);
      showError('');

      try {
        const res  = await fetch(API_BASE + '/api/v1/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Reset failed.');
          setBtnLoading('resetBtn', false);
          return;
        }

        showSuccess(data.message || 'Password reset successful!');
        setBtnLoading('resetBtn', false);

        // Auto-redirect to login after 2s
        setTimeout(() => {
          switchAuthTab('login');
          document.getElementById('loginEmail').value = '';
          document.getElementById('loginPassword').value = '';
          document.getElementById('loginPassword').focus();
          hideMessages();
        }, 2000);
      } catch {
        showError('Cannot connect to server.');
        setBtnLoading('resetBtn', false);
      }
    });

    // ── Check if already logged in ──
    (function initialAuthCheck() {
      const existing = localStorage.getItem('access_token');
      if (!existing) return;

      fetch(API_BASE + '/api/v1/auth/me', {
        headers: { 'Authorization': 'Bearer ' + existing }
      })
      .then(res => {
        if (res.ok) {
          window.location.href = 'index.html';
        } else {
          localStorage.removeItem('access_token');
          localStorage.removeItem('refresh_token');
          localStorage.removeItem('user');
        }
      })
      .catch(() => {
        // If verification cannot run (network / CSP), stay on login.
      });
    })();
  </script>

</body>
</html>
